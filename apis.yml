aid: astelia
name: Astelia
description: 'Astelia is an AI-native exposure management and vulnerability management
  company whose platform helps security teams find and fix the reachable fraction of
  their vulnerabilities. Using agentic AI and read-only integrations, Astelia maps network
  topology, extracts the technical requirements an exploit actually needs, and correlates
  reachability with network context to surface which vulnerabilities are truly exploitable
  by an attacker. Rather than ranking issues on probability scores alone, it delivers
  attack-path visualization, coverage-gap analysis, and evidence-based remediation guidance
  tailored to each organization''s environment. Astelia is backed by Index Ventures and
  documents its security posture in a public trust center (SOC 2 Type 2, ISO/IEC 27001:2022,
  HIPAA, GDPR). This API Evangelist profile enriches the company as a network lead; the
  product surface is enterprise SaaS with no public API published at this time.'
